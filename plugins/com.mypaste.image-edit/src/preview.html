<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. The host owns the theme, so the page
     * follows the appearance chosen in MyPaste instead of painting its own.
     */
    --im-bg: var(--mp-surface-solid, #f3ece1);
    --im-surface: var(--mp-surface-raised, #fbf7f0);
    --im-ink: var(--mp-ink, #2f261e);
    --im-muted: var(--mp-ink-soft, #8b7c6a);
    --im-line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --im-accent: var(--mp-accent, #a65d2e);
    --im-accent-ink: var(--mp-accent-ink, #fff8ef);
    --im-stage: var(--mp-code-surface, #ece3d5);
    --im-focus: color-mix(in srgb, var(--mp-accent, #a65d2e) 35%, transparent);
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --im-bg: var(--mp-surface-solid, #171412);
    --im-surface: var(--mp-surface-raised, #201c18);
    --im-ink: var(--mp-ink, #f0e6d9);
    --im-muted: var(--mp-ink-soft, #9a8c7b);
    --im-line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --im-accent: var(--mp-accent, #e2955f);
    --im-accent-ink: var(--mp-accent-ink, #241a12);
    --im-stage: var(--mp-code-surface, #12100e);
    --im-focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
  }
  html, body { height: 100%; }
  body { background: var(--im-bg); color: var(--im-ink); }

  .image-surface {
    display: grid;
    grid-template-columns: 76px minmax(0, 1fr) 236px;
    height: 100%;
    min-height: 0;
  }

  .tool-rail {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 8px;
    overflow: auto;
    border-right: 1px solid var(--im-line);
    background: var(--im-surface);
  }
  .tool-rail button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 2px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--im-muted);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .tool-rail button:hover { color: var(--im-ink); background: var(--im-bg); }
  .tool-rail button[aria-pressed="true"] {
    color: var(--im-accent-ink);
    background: var(--im-accent);
  }
  .tool-rail svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stage {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--im-stage);
  }
  .stage-scroll {
    flex: 1;
    display: flex;
    align-items: safe center;
    justify-content: safe center;
    min-height: 0;
    padding: 14px;
    overflow: auto;
  }
  #image-canvas {
    display: block;
    flex: none;
    box-shadow: 0 16px 40px rgba(40, 26, 12, 0.28);
    background: #fff;
    cursor: crosshair;
    touch-action: none;
  }
  #image-canvas:focus-visible { outline: 2px solid var(--im-focus); outline-offset: 3px; }

  .stage-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px;
    border-top: 1px solid var(--im-line);
    color: var(--im-muted);
    font-size: 12px;
  }
  .stage-foot .spacer { flex: 1; }
  #image-output { font-variant-numeric: tabular-nums; }

  .rail {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 0;
    padding: 18px 16px;
    overflow: auto;
    border-left: 1px solid var(--im-line);
    background: var(--im-surface);
  }
  .rail-head h1 { margin: 0 0 3px; font-size: 15px; font-weight: 650; }
  .rail-head p { margin: 0; color: var(--im-muted); font-size: 12px; line-height: 1.5; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span {
    color: var(--im-muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .field input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 9px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
  }
  .field input[type="text"]:focus-visible {
    outline: 2px solid var(--im-focus);
    outline-offset: 1px;
    border-color: var(--im-accent);
  }
  .field output { float: right; color: var(--im-ink); font-variant-numeric: tabular-nums; }
  .field input[type="range"] { width: 100%; accent-color: var(--im-accent); }

  .swatches { display: flex; gap: 7px; }
  .swatch {
    width: 22px;
    height: 22px;
    padding: 0;
    border: 2px solid transparent;
    background: var(--swatch);
    /* The ring is the theme's line, not a fixed dark alpha: the black swatch
       needs an edge against a dark surface as much as the white one does. */
    box-shadow: inset 0 0 0 1px var(--im-line);
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] {
    border-color: var(--im-surface);
    box-shadow: 0 0 0 2px var(--im-accent);
  }

  .rail-group { display: grid; gap: 6px; }
  .rail-group .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .rail-group button {
    padding: 7px 8px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .rail-group button:hover:not(:disabled) { border-color: var(--im-accent); }
  .rail-group button:disabled { opacity: 0.4; cursor: default; }
  .rail-group button.primary {
    border-color: transparent;
    background: var(--im-accent);
    color: var(--im-accent-ink);
  }

  .zoom { display: grid; grid-template-columns: 30px 1fr 30px auto; gap: 6px; align-items: center; }
  .zoom button {
    padding: 5px 8px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
    cursor: pointer;
  }
  .zoom button:disabled { opacity: 0.4; cursor: default; }
  /*
   * The selected zoom mode is a filled chip, like the active tool in the rail.
   * An accent outline alone sat next to the row's own borders and read as a
   * focus ring rather than as "this mode is on".
   */
  .zoom button[aria-pressed="true"] {
    border-color: transparent;
    background: var(--im-accent);
    color: var(--im-accent-ink);
  }
  .zoom output { text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; }

  .actions { display: grid; gap: 6px; margin-top: auto; }
  .actions button {
    padding: 9px 12px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .actions button:hover:not(:disabled) { border-color: var(--im-accent); }
  .actions button:disabled { opacity: 0.45; cursor: default; }
  .actions button.primary {
    border-color: transparent;
    background: var(--im-accent);
    color: var(--im-accent-ink);
  }
  /*
   * Close is the quiet action, but a control with neither fill nor border read
   * as plain text in the app: it keeps its outline and only its ink steps back.
   */
  .actions button.ghost {
    border-color: var(--im-line);
    background: transparent;
    color: var(--im-muted);
    font-weight: 500;
  }
  .actions button.ghost:hover:not(:disabled) {
    border-color: var(--im-accent);
    color: var(--im-ink);
  }
  .actions button:focus-visible,
  .rail-group button:focus-visible,
  .tool-rail button:focus-visible { outline: 2px solid var(--im-focus); outline-offset: 2px; }

  .status {
    min-height: 18px;
    margin: 0;
    color: var(--im-muted);
    font-size: 12px;
    line-height: 1.5;
  }
  .status[data-tone="error"] { color: var(--mp-danger, #b4553f); }

  #image-text-entry {
    position: fixed;
    left: 50%;
    bottom: 64px;
    z-index: 3;
    display: flex;
    gap: 6px;
    padding: 10px;
    border: 1px solid var(--im-line);
    background: var(--im-surface);
    box-shadow: 0 12px 32px rgba(40, 26, 12, 0.24);
    transform: translateX(-50%);
  }
  #image-text-entry[hidden] { display: none; }
  #image-text-input {
    width: 240px;
    padding: 6px 8px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
  }
  #image-text-entry button {
    padding: 6px 10px;
    border: 1px solid var(--im-line);
    background: var(--im-bg);
    color: var(--im-ink);
    font: inherit;
    cursor: pointer;
  }
  #image-text-entry button.primary {
    border-color: transparent;
    background: var(--im-accent);
    color: var(--im-accent-ink);
  }

  /*
   * Corner system (host D-1099): one ladder, so every box answers with the
   * same family. A mark is 4px, a control 6px, a card or popover 10px, a
   * floating dialog 14px, and an indicator or scrollbar is a capsule.
   */
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  button,
  .swatch,
  .field input[type="text"],
  #image-text-input {
    border-radius: var(--radius-sm);
  }
  #image-text-entry {
    border-radius: var(--radius-md);
  }
</style>

<div class="image-surface">
  <nav class="tool-rail" role="toolbar" aria-orientation="vertical" aria-label="标注工具">
    <button type="button" data-image-tool="crop" aria-pressed="false" title="裁剪">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3v10.5a.5.5 0 0 0 .5.5H17"/><path d="M3 6h10.5a.5.5 0 0 1 .5.5V17"/></svg>
      <span>裁剪</span>
    </button>
    <button type="button" data-image-tool="pen" aria-pressed="true" title="画笔">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.4 3.7 16.3 6.6 7.5 15.4l-3.9.9.9-3.9z"/><path d="m11.6 5.5 2.9 2.9"/></svg>
      <span>画笔</span>
    </button>
    <button type="button" data-image-tool="rect" aria-pressed="false" title="方框">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="4.5" width="13" height="11" rx="1.4"/></svg>
      <span>方框</span>
    </button>
    <button type="button" data-image-tool="arrow" aria-pressed="false" title="箭头">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16 15.5 4.5"/><path d="M9.2 4.5h6.3v6.3"/></svg>
      <span>箭头</span>
    </button>
    <button type="button" data-image-tool="mosaic" aria-pressed="false" title="马赛克">
      <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.5" y="3.5" width="5.2" height="5.2" rx="1"/><rect x="11.3" y="3.5" width="5.2" height="5.2" rx="1"/><rect x="3.5" y="11.3" width="5.2" height="5.2" rx="1"/><rect x="11.3" y="11.3" width="5.2" height="5.2" rx="1"/></svg>
      <span>马赛克</span>
    </button>
    <button type="button" data-image-tool="text" aria-pressed="false" title="文字">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.2h12"/><path d="M10 5.2V16"/></svg>
      <span>文字</span>
    </button>
  </nav>

  <section class="stage">
    <div class="stage-scroll" id="image-scroll">
      <canvas id="image-canvas" tabindex="0" aria-label="图片编辑画布"></canvas>
    </div>
    <footer class="stage-foot">
      <span id="image-hint">画笔：在图片上拖动即可标注。</span>
      <span class="spacer"></span>
      <span id="image-tool-title">画笔</span>
      <span id="image-output">—</span>
    </footer>
  </section>

  <aside class="rail">
    <div class="rail-head">
      <h1>图片编辑</h1>
      <p>原图不会被覆盖；保存时新建一个剪贴板条目。</p>
    </div>
    <label class="field">
      <span>标题</span>
      <input id="image-title" type="text" maxlength="120" autocomplete="off" spellcheck="false">
    </label>
    <div class="field">
      <span>颜色</span>
      <div class="swatches" id="image-colors"></div>
    </div>
    <label class="field">
      <span>笔触 <output id="image-size-value" for="image-size">4</output></span>
      <input id="image-size" type="range" min="1" max="24" step="1" value="4">
    </label>
    <div class="zoom" role="group" aria-label="缩放">
      <button id="image-zoom-out" type="button" title="缩小">−</button>
      <output id="image-zoom" aria-live="polite">100%</output>
      <button id="image-zoom-in" type="button" title="放大">＋</button>
      <button id="image-zoom-fit" type="button" aria-pressed="true" title="适应窗口">适应</button>
    </div>
    <div class="rail-group">
      <div class="row">
        <button id="image-rotate" type="button">旋转</button>
        <button id="image-flip" type="button">翻转</button>
      </div>
      <div class="row">
        <button id="image-undo" type="button" disabled>撤销</button>
        <button id="image-redo" type="button" disabled>重做</button>
      </div>
      <button id="image-reset" type="button">重置</button>
      <button id="image-crop-apply" class="primary" type="button" hidden>应用裁剪</button>
    </div>
    <div class="actions">
      <button type="button" class="primary" data-action="save" disabled>保存为新条目</button>
      <button type="button" data-action="copy" disabled>复制图片</button>
      <button type="button" class="ghost" data-action="close">关闭</button>
    </div>
    <p id="image-status" class="status" role="status"></p>
  </aside>

  <div id="image-text-entry" role="dialog" aria-label="添加文字" hidden>
    <input id="image-text-input" type="text" maxlength="200" placeholder="输入文字" autocomplete="off">
    <button id="image-text-confirm" class="primary" type="button">确定</button>
    <button id="image-text-cancel" type="button">取消</button>
  </div>
</div>
