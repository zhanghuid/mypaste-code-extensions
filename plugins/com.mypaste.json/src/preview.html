<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 编辑器</title>

<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host. The host owns the theme, so there is no second copy.
     */
    --bg: var(--mp-surface-solid, #f6f2ea);
    --panel: var(--mp-surface-raised, #fbf8f2);
    --ink: var(--mp-ink, #241f19);
    --muted: var(--mp-ink-soft, #776b5c);
    --line: var(--mp-line, rgba(60, 45, 25, 0.16));
    --accent: var(--mp-accent, #9a5427);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --focus: var(--mp-accent, #9a5427);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    /* The code surface follows the resolved appearance (D-1046). */
    --code-bg: var(--mp-code-surface, #ede5d8);
    --code-ink: var(--mp-code-ink, #2f261e);
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --panel: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.14));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --focus: var(--mp-accent, #e2955f);
    --code-bg: var(--mp-code-surface, #171412);
    --code-ink: var(--mp-code-ink, #f0e6d9);
  }

  /* No rounded boxes anywhere (D-1045); the code surface keeps one material. */
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }

  .shell {
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 18px 32px;
  }

  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .head-text { min-width: 0; }
  h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .summary {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
  }

  /* Every action in a row is one size (D-1051). */
  .action {
    flex: none;
    height: 30px;
    padding: 0 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .action:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .action:disabled { color: var(--muted); cursor: default; opacity: 0.6; }

  .status {
    min-height: 0;
    margin: 0;
    padding: 10px 0;
    color: var(--muted);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  .status:empty { padding: 0; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .meta {
    margin: 0;
    padding: 8px 0 6px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }

  /*
   * One editable code surface: square corners, no shadow, and the host's code
   * palette so the text sits on the surface the theme designed (D-1046).
   */
  .editor {
    display: block;
    width: 100%;
    min-height: 340px;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--code-bg);
    color: var(--code-ink);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    tab-size: 2;
    resize: vertical;
    white-space: pre;
    overflow: auto;
  }
  .editor:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .output {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .output-head {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .output-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }
  .output-head .meta { flex: 1; padding: 0; }
  .output pre {
    margin: 0;
    max-height: 340px;
    overflow: auto;
    padding: 12px;
    border: 1px solid var(--line);
    background: var(--code-bg);
    color: var(--code-ink);
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre;
    tab-size: 2;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .filter {
    flex: 1;
    min-width: 0;
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .filter:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .foot {
    margin-top: 20px;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main class="shell">
  <header class="head">
    <div class="head-text">
      <h1>JSON 编辑器</h1>
      <p class="summary" id="summary">等待条目…</p>
    </div>
    <button class="action" id="copy-json" type="button">复制 JSON</button>
  </header>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <div class="toolbar" role="toolbar" aria-label="JSON 动作">
    <button class="action" id="format" type="button">美化</button>
    <button class="action" id="minify" type="button">压缩</button>
    <button class="action" id="escape" type="button">转义</button>
    <button class="action" id="to-xml" type="button">→ XML</button>
    <button class="action" id="to-ts" type="button">→ TypeScript</button>
  </div>
  <section>
    <p class="meta" id="meta"></p>
    <textarea class="editor" id="editor" spellcheck="false" autocomplete="off"
      autocapitalize="off" wrap="off" aria-label="可编辑的 JSON"></textarea>
  </section>
  <section class="output" id="output" hidden>
    <div class="output-head">
      <h2 id="output-title">结果</h2>
      <p class="meta" id="output-meta"></p>
      <button class="action" id="copy-output" type="button">复制结果</button>
    </div>
    <pre id="output-text" tabindex="0" aria-label="转换结果"></pre>
  </section>
  <section class="filter-bar">
    <input class="filter" id="filter" type="text" spellcheck="false"
      placeholder="data.users[0].name 或 .filter(x =&gt; x.age &gt; 18)"
      aria-label="JavaScript 表达式过滤">
    <button class="action" id="filter-run" type="button">过滤</button>
  </section>
  <footer class="foot">
    Prettier 内置于页面，不需要 Node；不联网、不读取其它条目，复制由宿主执行。
    过滤框只对当前 JSON 求值，不改动原数据。
  </footer>
</main>
<script>
<!--bundle-->
</script>
</body>
</html>
