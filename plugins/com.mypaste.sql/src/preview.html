<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 工作区</title>
<style>
  /*
   * The SQL workspace, drawn by the page itself (D-1097). Colours come from
   * the host's resolved tokens (D-1042/D-1043) and corners from the host's
   * ladder (D-1099); the page's own palette only stands in for an older host.
   * One header band carries the document and its actions, one toolbar carries
   * the three layout choices, and the editor fills what is left.
   */
  :root {
    color-scheme: light;
    --bg: var(--mp-surface-solid, #f6f2ea);
    --surface: var(--mp-surface-raised, #fbf8f2);
    --ink: var(--mp-ink, #241f19);
    --muted: var(--mp-ink-soft, #776b5c);
    --line: var(--mp-line, rgba(60, 45, 25, 0.16));
    --accent: var(--mp-accent, #9a5427);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --danger: var(--mp-danger, #b65b36);
    --success: var(--mp-success, #4d7a3a);
    --focus: color-mix(in srgb, var(--mp-accent, #9a5427) 35%, transparent);
    --editor-bg: var(--mp-code-surface, #ede5d8);
    --editor-ink: var(--mp-code-ink, #2f261e);
    --selection: color-mix(in srgb, var(--editor-ink) 22%, transparent);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --font: var(--mp-font-body, -apple-system, "PingFang SC", "Segoe UI", sans-serif);
    --tok-keyword: var(--mp-code-keyword, #9c4a15);
    --tok-string: var(--mp-code-string, #476a2f);
    --tok-number: var(--mp-code-number, #855715);
    --tok-property: var(--mp-code-property, #1f6b6a);
    --tok-comment: var(--mp-code-comment, #7d7264);
    --tok-type: var(--mp-code-type, #2d5580);
    --tok-literal: var(--mp-code-literal, #7a3d86);
  }
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.14));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --danger: var(--mp-danger, #e89a83);
    --success: var(--mp-success, #9ab57f);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --editor-bg: var(--mp-code-surface, #241e19);
    --editor-ink: var(--mp-code-ink, #f5ecdf);
    --selection: color-mix(in srgb, var(--editor-ink) 28%, transparent);
    --tok-keyword: var(--mp-code-keyword, #e8a06a);
    --tok-string: var(--mp-code-string, #a7c48a);
    --tok-number: var(--mp-code-number, #e0bd84);
    --tok-property: var(--mp-code-property, #8fc7c4);
    --tok-comment: var(--mp-code-comment, #948675);
    --tok-type: var(--mp-code-type, #a8bede);
    --tok-literal: var(--mp-code-literal, #d3a9df);
  }
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    overflow: hidden;
  }
  button, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  .icon { display: block; width: 14px; height: 14px; }

  /* Document header: one 46px band, the name at the left, tools at the right. */
  .doc-head {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 46px;
    padding: 0 10px 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex: none;
  }
  .doc-id {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
    flex: 1;
  }
  .doc-icon {
    width: 18px;
    height: 18px;
    flex: none;
    color: var(--accent);
  }
  .doc-kind {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    padding: 2px 5px 1px;
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    border-radius: var(--radius-xs);
    flex: none;
  }
  .doc-title {
    margin: 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .doc-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: none;
  }
  .action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .action:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .action:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .action.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
  }
  .action.primary:hover { background: var(--accent); filter: brightness(1.06); color: var(--accent-ink); }
  .action.toggle[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .action.toggle[aria-pressed="true"]:hover {
    background: var(--accent);
    filter: brightness(1.06);
    color: var(--accent-ink);
  }
  .action[disabled] { opacity: 0.45; cursor: default; }
  .doc-close {
    margin-left: 4px;
    padding-left: 10px;
    border-left: 1px solid var(--line);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }
  .doc-close .icon { width: 13px; height: 13px; }

  /* Toolbar: the three layout choices, one row of 28px controls. */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 40px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 55%, var(--bg));
    flex: none;
    flex-wrap: wrap;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .field select {
    height: 26px;
    padding: 0 22px 0 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background-color: var(--surface);
    color: var(--ink);
    font-size: 11px;
    font-weight: 500;
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 11px) 11px, calc(100% - 7px) 11px;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .field select:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .toolbar-spacer { flex: 1; }
  .counts {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  /* The editor fills the rest: gutter, painted copy, and the real textarea. */
  .workspace {
    flex: 1;
    min-height: 0;
    display: flex;
    margin: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--editor-bg);
    overflow: hidden;
    position: relative;
  }
  .gutter {
    width: 48px;
    flex: none;
    padding: 12px 6px 12px 0;
    border-right: 1px solid var(--line);
    background: color-mix(in srgb, var(--editor-bg) 80%, var(--surface));
    overflow: hidden;
    user-select: none;
  }
  .gutter-inner {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 21px;
    text-align: right;
    color: color-mix(in srgb, var(--editor-ink) 38%, transparent);
  }
  .gutter-line { height: 21px; }
  .gutter-line.error {
    color: var(--danger);
    font-weight: 700;
  }
  .code-surface {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }
  .highlight,
  .code-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 12px 16px 24px;
    border: 0;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 21px;
    tab-size: 2;
    /* Wrapping is the default; the head's toggle turns it off. */
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  :root[data-wrap="off"] .highlight,
  :root[data-wrap="off"] .code-input {
    white-space: pre;
    overflow-wrap: normal;
  }
  .highlight {
    overflow: hidden;
    color: var(--editor-ink);
    pointer-events: none;
  }
  .code-input {
    resize: none;
    overflow: auto;
    background: transparent;
    color: transparent;
    caret-color: var(--editor-ink);
    -webkit-text-fill-color: transparent;
    outline: none;
  }
  .code-input::selection {
    background: var(--selection);
    -webkit-text-fill-color: transparent;
  }
  .code-input::placeholder { color: color-mix(in srgb, var(--editor-ink) 42%, transparent); }
  .code-input:focus-visible { box-shadow: inset 0 0 0 1px var(--focus); }

  .tok-keyword { color: var(--tok-keyword); font-weight: 600; }
  .tok-type { color: var(--tok-type); }
  .tok-literal { color: var(--tok-literal); }
  .tok-property { color: var(--tok-property); }
  .tok-function { color: var(--tok-type); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-error {
    text-decoration: underline wavy var(--danger);
    text-underline-offset: 3px;
  }

  /* Status: action feedback on the left, finding and position on the right. */
  .statusbar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 30px;
    padding: 0 16px 8px;
    color: var(--muted);
    font-size: 11px;
    flex: none;
  }
  .status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status.ok { color: var(--success); }
  .status.bad { color: var(--danger); }
  .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
  }
  .finding {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 46vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--danger);
  }
  .finding::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--danger);
    flex: none;
  }
  .finding.clean { color: var(--muted); }
  .finding.clean::before { background: color-mix(in srgb, var(--muted) 55%, transparent); }

  @media (max-width: 620px) {
    .action-label { display: none; }
    .action { padding: 0 7px; }
    .toolbar { gap: 10px; padding: 6px 12px; }
    .workspace { margin: 8px; }
    .gutter { width: 40px; }
    .finding { max-width: 52vw; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .action { transition: background-color 120ms ease, color 120ms ease; }
  }
</style>
</head>
<body>
  <header class="doc-head">
    <div class="doc-id">
      <svg class="doc-icon" viewBox="0 0 20 20" aria-hidden="true">
        <ellipse cx="10" cy="4.8" rx="6.4" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3.6 4.8v10.4c0 1.4 2.9 2.6 6.4 2.6s6.4-1.2 6.4-2.6V4.8" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3.6 10c0 1.4 2.9 2.6 6.4 2.6s6.4-1.2 6.4-2.6" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="doc-kind">SQL</span>
      <h1 class="doc-title" id="doc-title">等待条目…</h1>
    </div>
    <div class="doc-actions">
      <button type="button" class="action primary" id="format" title="美化 SQL" aria-label="美化 SQL">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4h7M2 8h5M2 12h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12.2 3.2 12.8 5l1.8.6-1.8.6-.6 1.8-.6-1.8L9.8 5.6l1.8-.6z" fill="currentColor"/>
        </svg>
        <span class="action-label">美化</span>
      </button>
      <button type="button" class="action" id="compress" title="压缩为一行" aria-label="压缩为一行">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 4h10M3 12h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.5 6.5 8 8l1.5-1.5M6.5 9.5 8 8l1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="action-label">压缩</span>
      </button>
      <button type="button" class="action" id="copy" title="复制当前内容" aria-label="复制当前内容">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <span class="action-label">复制</span>
      </button>
      <button type="button" class="action toggle" id="wrap-toggle" aria-pressed="true"
        title="长行在面板内自动换行；关闭后横向滚动" aria-label="自动换行">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 4.4h12M2 11.6h5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10.2 9.2 12.4 11.6l-2.2 2.4M12.4 11.6H8.6" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="action-label">换行</span>
      </button>
      <button type="button" class="action doc-close" id="close" title="关闭" aria-label="关闭">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="m4 4 8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="toolbar" role="group" aria-label="SQL 排版选项">
    <label class="field">方言
      <select id="dialect" aria-label="SQL 方言"></select>
    </label>
    <label class="field">关键字
      <select id="keyword-case" aria-label="关键字大小写">
        <option value="preserve">保持原样</option>
        <option value="upper">大写</option>
        <option value="lower">小写</option>
      </select>
    </label>
    <label class="field">缩进
      <select id="indent" aria-label="缩进宽度">
        <option value="2">2 空格</option>
        <option value="4" selected>4 空格</option>
        <option value="8">8 空格</option>
      </select>
    </label>
    <span class="toolbar-spacer"></span>
    <span class="counts" id="counts">0 行</span>
  </div>

  <main class="workspace">
    <div class="gutter" id="gutter" aria-hidden="true"><div class="gutter-inner" id="gutter-inner"></div></div>
    <div class="code-surface">
      <pre class="highlight" id="highlight" aria-hidden="true"></pre>
      <textarea class="code-input" id="editor" spellcheck="false" autocomplete="off"
        autocapitalize="off" wrap="soft" placeholder="打开一条 SQL 条目后，在这里编辑。"
        aria-label="SQL 文本" aria-describedby="status finding"></textarea>
    </div>
  </main>

  <footer class="statusbar">
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <div class="status-right">
      <span class="finding clean" id="finding"></span>
      <span id="position">1:1</span>
    </div>
  </footer>

  <p class="sr-only" hidden>美化、压缩、自动换行、语法高亮与诊断都在本页完成，不联网，也不执行 SQL。复制由宿主写入剪贴板。</p>
<script>
<!--bundle-->
</script>
</body>
</html>
