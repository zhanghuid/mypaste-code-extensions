<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. The host owns the theme, so there is
     * no second copy to drift.
     */
    --bg: var(--mp-surface-solid, #f3ece1);
    --solid: var(--mp-surface-solid, #f3ece1);
    --surface: var(--mp-surface-raised, #fbf7f0);
    --ink: var(--mp-ink, #2f261e);
    --muted: var(--mp-ink-soft, #8b7c6a);
    --line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --accent: var(--mp-accent, #a65d2e);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --focus: color-mix(in srgb, var(--mp-accent, #a65d2e) 35%, transparent);
    --added: color-mix(in srgb, var(--mp-success, #3f6b3a) 12%, transparent);
    --removed: color-mix(in srgb, var(--mp-danger, #b4472c) 10%, transparent);
    --mark: color-mix(in srgb, var(--mp-accent, #a65d2e) 28%, transparent);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --solid: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --added: color-mix(in srgb, var(--mp-success, #4f8a49) 18%, transparent);
    --removed: color-mix(in srgb, var(--mp-danger, #d58a68) 12%, transparent);
    --mark: color-mix(in srgb, var(--mp-accent, #e2955f) 34%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }

  /*
   * The document header, shared with the code editor. The page owns the whole
   * card now (D-1097), so this is one 44px band instead of a strip holding an
   * empty tab: the title sits at the left with an accent rule beneath it, and
   * the format label joins the page's actions at the right, all of them 28px
   * high so the row has a single size (D-1051). Closing is set apart by a
   * hairline and is the only control the page does not tint.
   */
  .doc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 44px;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .doc-id {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    height: 100%;
    padding-right: 8px;
  }
  .doc-id::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--accent);
  }
  .doc-icon { width: 15px; height: 15px; flex: none; color: var(--muted); }
  .doc-title {
    min-width: 0;
    max-width: 46vw;
    overflow: hidden;
    font: 600 13px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .doc-actions { display: flex; align-items: center; gap: 4px; min-width: 0; }
  /* The format label is information, not a control: no box, no hover state. */
  .badge {
    display: inline-flex;
    align-items: center;
    height: 28px;
    margin-right: 6px;
    padding: 0 2px;
    color: var(--muted);
    font: 11.5px/1 var(--mono);
    white-space: nowrap;
  }
  .doc-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-action .icon { width: 15px; height: 15px; }
  .doc-action:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    color: var(--ink);
  }
  .doc-action:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .doc-action:disabled { opacity: 0.4; cursor: default; }
  .doc-action[data-action="save"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .doc-action[data-action="save"]:hover:not(:disabled) {
    background: var(--accent);
    color: var(--accent-ink);
    filter: brightness(1.08);
  }
  .doc-sep { width: 1px; height: 16px; flex: none; margin: 0 4px; background: var(--line); }
  .doc-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-close .icon { width: 14px; height: 14px; }
  .doc-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .doc-close:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  .pane-heads {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 12px;
    border-right: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    cursor: text;
  }
  .pane-head:last-child { border-right: 0; }
  .pane-head strong {
    overflow: hidden;
    color: var(--ink);
    font-family: var(--mp-font-display, "New York", "Songti SC", Georgia, serif);
    font-size: 12px;
    font-weight: 600;
    text-overflow: ellipsis;
  }

  .scroller { min-height: 0; overflow: auto; background: var(--surface); }
  /* A click anywhere in a pane opens its editor, not only on the text. */
  .scroller:not(.editing) { cursor: text; }
  .rows {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-content: start;
  }
  .diff-row { display: contents; }
  .line {
    display: flex;
    gap: 10px;
    padding: 0 10px;
    color: var(--ink);
    font: 12.5px/1.65 var(--mono);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .line.before { border-right: 1px solid var(--line); }
  .line-number {
    flex: none;
    width: 24px;
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    user-select: none;
  }
  .line-text { flex: 1; min-width: 0; }
  .diff-row[data-kind="delete"] .line.before { background: var(--removed); }
  .diff-row[data-kind="insert"] .line.after { background: var(--added); }
  .diff-row[data-kind="change"] .line.before { background: var(--removed); }
  .diff-row[data-kind="change"] .line.after { background: var(--added); }
  .diff-mark {
    padding: 0 1px;
    background: var(--mark);
    color: inherit;
  }
  .empty-state {
    padding: 28px 18px;
    color: var(--muted);
    font-size: 12px;
  }

  /*
   * Edit mode (one click on either side). The edited side becomes one
   * textarea spanning the column, kept alive while the other side re-renders
   * against it; the two panes scroll independently.
   */
  .scroller.editing { overflow: hidden; }
  .rows.editing {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    height: 100%;
    align-content: stretch;
    align-items: stretch;
  }
  .rows.editing .diff-row { display: block; }
  .rows.editing .line { height: 100%; }
  .rows.editing .line.before { border-right: 0; }
  .edit-side {
    display: flex;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }
  .edit-side[data-side="before"],
  .diff-column[data-side="before"] { border-right: 1px solid var(--line); }
  .edit-input {
    flex: 1;
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 10px 12px;
    border: 0;
    outline: none;
    background: color-mix(in srgb, var(--accent) 6%, transparent);
    color: var(--ink);
    font: 12.5px/1.65 var(--mono);
    resize: none;
    tab-size: 2;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .edit-input::selection { background: var(--mark); }
  .diff-column { min-width: 0; min-height: 0; overflow: auto; }

  /*
   * The status bar mirrors the code editor's footer: the comparison's own
   * state on the left, its size on the right.
   */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 26px;
    padding: 4px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font: 11px/1.4 var(--mono);
  }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-left: auto;
    white-space: nowrap;
  }
  #diff-stats {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #diff-status {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #diff-status[data-tone="error"] { color: var(--mp-danger-ink, #b4472c); }
  #diff-status[hidden] { display: none; }

  /*
   * Corner system (host D-1099): one ladder, so every box answers with the
   * same family. A mark is 4px, a control 6px, a card or popover 10px, a
   * floating dialog 14px, and an indicator or scrollbar is a capsule.
   */
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  button {
    border-radius: var(--radius-sm);
  }
  .doc-id::after {
    border-radius: var(--radius-pill);
  }
</style>
</head>
<body>
  <header class="doc-head">
    <div class="doc-id">
      <svg class="doc-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 2.5h6l3 3v8h-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <span class="doc-title" id="current-title">当前条目</span>
    </div>
    <div class="doc-actions">
      <span class="badge" id="diff-language"></span>
      <button type="button" class="doc-action" data-action="copy"
        title="复制当前文本" aria-label="复制当前文本">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" class="doc-action" data-action="save"
        title="保存为新条目" aria-label="保存为新条目">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M3 2.5h8l2 2v9h-10z"/>
            <path d="M5 2.5v4h6v-4"/>
            <path d="M5 13.5v-4h6v4"/>
          </g>
        </svg>
      </button>
      <span class="doc-sep" aria-hidden="true"></span>
      <button type="button" class="doc-close" id="doc-close" title="关闭" aria-label="关闭">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="pane-heads">
    <div class="pane-head before" data-side="before">对照 · <strong id="companion-title">—</strong></div>
    <div class="pane-head after" data-side="after">当前文本</div>
  </div>
  <div class="scroller" id="diff-scroller">
    <div class="rows" id="diff-rows"></div>
    <p class="empty-state" id="diff-empty" hidden>等一等，宿主正在交付两条文本。</p>
  </div>
  <footer class="statusbar">
    <span id="diff-status" role="status" aria-live="polite" hidden></span>
    <div class="statusbar-right">
      <span id="diff-stats">等待宿主交付文本…</span>
    </div>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
