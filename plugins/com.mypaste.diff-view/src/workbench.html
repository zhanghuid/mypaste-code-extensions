<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    --bg: #f3ece1;
    --surface: #fbf7f0;
    --ink: #2f261e;
    --muted: #8b7c6a;
    --line: rgba(70, 48, 26, 0.14);
    --accent: #a65d2e;
    --accent-ink: #fff8ef;
    --focus: rgba(166, 93, 46, 0.35);
    --added: rgba(63, 107, 58, 0.12);
    --removed: rgba(180, 71, 44, 0.1);
    --mark: rgba(166, 93, 46, 0.28);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: #171412;
    --surface: #201c18;
    --ink: #f0e6d9;
    --muted: #9a8c7b;
    --line: rgba(255, 236, 214, 0.12);
    --accent: #e2955f;
    --accent-ink: #241a12;
    --focus: rgba(226, 149, 95, 0.35);
    --added: rgba(168, 196, 138, 0.14);
    --removed: rgba(231, 160, 122, 0.12);
    --mark: rgba(226, 149, 95, 0.34);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .kicker {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  #diff-stats {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--ink);
    font: 12px/1.4 var(--mono);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .metric {
    color: var(--muted);
    font: 11px/1 var(--mono);
    white-space: nowrap;
  }
  #doc-close {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #doc-close:hover { color: var(--ink); border-color: var(--accent); }

  .pane-heads {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px minmax(0, 1fr);
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .pane-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 12px;
    border-right: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
  }
  .pane-head:last-child { border-right: 0; }
  .pane-head.before { grid-column: 1 / 3; }
  .pane-head.after { grid-column: 3 / 5; }
  .pane-head strong {
    overflow: hidden;
    color: var(--ink);
    font: 500 12px/1.4 -apple-system, "PingFang SC", sans-serif;
    text-overflow: ellipsis;
  }

  .scroller { min-height: 0; overflow: auto; background: var(--surface); }
  .rows {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) 44px minmax(0, 1fr);
    align-content: start;
  }
  .diff-row { display: contents; }
  .line {
    display: flex;
    gap: 10px;
    padding: 0 10px;
    color: var(--ink);
    font: 12.5px/1.65 var(--mono);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .line.before { border-right: 1px solid var(--line); }
  .line-number {
    flex: none;
    width: 24px;
    color: var(--muted);
    font-size: 11px;
    text-align: right;
    user-select: none;
  }
  .line-text { flex: 1; min-width: 0; }
  .diff-row[data-kind="delete"] .line.before { background: var(--removed); }
  .diff-row[data-kind="insert"] .line.after { background: var(--added); }
  .diff-row[data-kind="change"] .line.before { background: var(--removed); }
  .diff-row[data-kind="change"] .line.after { background: var(--added); }
  .diff-mark {
    padding: 0 1px;
    background: var(--mark);
    color: inherit;
  }
  .empty-state {
    padding: 28px 18px;
    color: var(--muted);
    font-size: 12px;
  }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #diff-status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #diff-status[data-tone="error"] { color: #b4472c; }
  #diff-status[hidden] { display: none; }
  footer button {
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  footer button:hover:not(:disabled) { border-color: var(--accent); }
  footer button:disabled { opacity: 0.45; cursor: default; }
  footer button[data-action="save"] {
    border-color: transparent;
    background: var(--accent);
    color: var(--accent-ink);
  }
</style>
</head>
<body>
  <header>
    <span class="kicker">高亮对比</span>
    <span id="diff-stats">等待宿主交付文本…</span>
    <span class="metric" id="diff-language"></span>
    <button id="doc-close" type="button" data-action="close" aria-label="关闭高亮对比">×</button>
  </header>
  <div class="pane-heads">
    <div class="pane-head before">对照 · <strong id="companion-title">—</strong></div>
    <div class="pane-head after">当前 · <strong id="current-title">—</strong></div>
  </div>
  <div class="scroller">
    <div class="rows" id="diff-rows"></div>
    <p class="empty-state" id="diff-empty" hidden>等一等，宿主正在交付两条文本。</p>
  </div>
  <footer>
    <span id="diff-status" role="status" aria-live="polite" hidden></span>
    <button type="button" data-action="copy">复制当前文本</button>
    <button type="button" data-action="save">保存为新条目</button>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
