<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. Syntax colours come from the host's
     * code palette, which is designed for the code surface, so the editor
     * takes that surface and ink too.
     */
    --bg: var(--mp-surface-solid, #f3ece1);
    --solid: var(--mp-surface-solid, #f3ece1);
    --surface: var(--mp-surface-raised, #fbf7f0);
    --ink: var(--mp-ink, #2f261e);
    --muted: var(--mp-ink-soft, #8b7c6a);
    --line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --accent: var(--mp-accent, #a65d2e);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --focus: color-mix(in srgb, var(--mp-accent, #a65d2e) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 22%, transparent);
    --tok-keyword: var(--mp-code-keyword, #9a3f1d);
    --tok-string: var(--mp-code-string, #3f6b3a);
    --tok-number: var(--mp-code-number, #7a4fa3);
    --tok-comment: var(--mp-code-comment, #8b7c6a);
    --tok-type: var(--mp-code-type, #2d5f86);
    --tok-function: var(--mp-code-function, #245f70);
    /* The host has no separate literal token; a number is the closest voice. */
    --tok-literal: var(--mp-code-number, #8a5a00);
    --tok-property: var(--mp-code-property, #6b4423);
    --tok-tag: var(--mp-code-tag, #9a3f1d);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --solid: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 26%, transparent);
    --tok-keyword: var(--mp-code-keyword, #e7a07a);
    --tok-string: var(--mp-code-string, #a8c48a);
    --tok-number: var(--mp-code-number, #c8a6e0);
    --tok-comment: var(--mp-code-comment, #8f8272);
    --tok-type: var(--mp-code-type, #8fc0e0);
    --tok-function: var(--mp-code-function, #8fd0c8);
    --tok-literal: var(--mp-code-number, #d9b46a);
    --tok-property: var(--mp-code-property, #d9b48c);
    --tok-tag: var(--mp-code-tag, #e7a07a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .kicker {
    color: var(--muted);
    font-family: var(--mp-font-display, "New York", "Songti SC", Georgia, serif);
    font-size: 11px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  #doc-title {
    flex: 1 1 220px;
    min-width: 0;
    height: 30px;
    padding: 0 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font: 600 14px/1.4 var(--mp-font-display, "New York", "Songti SC", Georgia, serif);
  }
  #doc-title:hover { border-color: var(--line); }
  #doc-title:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus);
  }
  .metric {
    color: var(--muted);
    font: 11px/1 var(--mono);
    white-space: nowrap;
  }
  #doc-dirty {
    color: var(--accent);
    font-size: 11px;
    white-space: nowrap;
  }
  #doc-dirty[hidden] { display: none; }

  /*
   * One control size for the whole header row (D-1051). Every surface is
   * square (D-1045), sits on --surface with a --line border, and draws its
   * chevron as one inline SVG (D-1055) instead of a CSS triangle or a native
   * select chrome that would bring its own radius.
   */
  #doc-language,
  #doc-highlight,
  .menu-trigger,
  header button[data-action] {
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    color: var(--ink);
    font: 12px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    cursor: pointer;
  }
  #doc-language,
  #doc-highlight {
    padding: 0 24px 0 8px;
    appearance: none;
    font-family: var(--mono);
    font-size: 11px;
  }
  .select { position: relative; display: inline-flex; }
  header .chevron {
    width: 9px;
    height: 6px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .select .chevron {
    position: absolute;
    top: 50%;
    right: 8px;
    color: var(--muted);
    transform: translateY(-50%);
  }
  header button[data-action] { padding: 0 12px; }
  header button[data-action="save"] {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  #doc-language:hover,
  #doc-highlight:hover,
  .menu-trigger:hover:not(:disabled),
  header button[data-action]:hover:not(:disabled) {
    border-color: color-mix(in srgb, var(--ink) 30%, var(--line));
  }
  #doc-language:focus-visible,
  #doc-highlight:focus-visible,
  .menu-trigger:focus-visible,
  header button[data-action]:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus);
  }
  #doc-language:disabled,
  #doc-highlight:disabled,
  .menu-trigger:disabled,
  header button[data-action]:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.55;
  }
  .format-actions { position: relative; display: inline-flex; }
  .menu-trigger {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 9px 0 10px;
  }
  .menu-trigger[aria-expanded="true"] { border-color: var(--accent); }

  /*
   * The menu is an opaque raised sheet: --surface is translucent in the
   * host's warm palette, so it is laid over --solid instead of over the
   * editor. That is the whole difference between a menu and a ghost.
   */
  #doc-format-menu {
    position: fixed;
    z-index: 40;
    min-width: 220px;
    max-width: calc(100vw - 16px);
    overflow-y: auto;
    padding: 4px 0 6px;
    border: 1px solid var(--line);
    background:
      linear-gradient(var(--surface), var(--surface)),
      var(--solid);
    color: var(--ink);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--ink) 20%, transparent);
  }
  #doc-format-menu[hidden] { display: none; }
  #doc-format-menu:focus { outline: none; }
  .format-group + .format-group,
  .format-empty + .format-group {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--line);
  }
  .format-group-title {
    padding: 8px 12px 3px;
    color: var(--muted);
    font: 600 10.5px/1.4 var(--mono);
    letter-spacing: 0.08em;
  }
  .format-empty {
    padding: 10px 12px 9px;
    color: var(--muted);
    font: 12px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  .format-item {
    display: block;
    width: 100%;
    height: 32px;
    padding: 0 12px;
    overflow: hidden;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 12.5px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .format-item:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  .format-item:focus-visible {
    outline: none;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .format-item:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.5;
  }
  @media (max-width: 640px) {
    .metric, #doc-dirty { display: none; }
  }
  .editor {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
    background: var(--editor-bg);
  }
  .editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  #editor-gutter {
    margin: 0;
    padding: 14px 10px 14px 14px;
    overflow: hidden;
    border-right: 1px solid color-mix(in srgb, var(--editor-ink) 14%, transparent);
    color: var(--mp-code-comment, var(--muted));
    font: 12.5px/1.65 var(--mono);
    text-align: right;
    white-space: pre;
    user-select: none;
  }
  .editor-code {
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  #editor-highlight,
  #editor-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 14px 16px;
    border: 0;
    font: 12.5px/1.65 var(--mono);
    white-space: pre;
    tab-size: 2;
    overflow: auto;
  }
  #editor-highlight {
    overflow: hidden;
    color: var(--editor-ink);
    background: transparent;
    pointer-events: none;
  }
  #editor-input {
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    resize: none;
    outline: none;
  }
  #editor-input::selection { background: var(--selection); }
  #editor-input::placeholder { color: var(--muted); }

  .tok-keyword { color: var(--tok-keyword); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-type { color: var(--tok-type); }
  .tok-function { color: var(--tok-function); }
  .tok-literal { color: var(--tok-literal); }
  .tok-property { color: var(--tok-property); }
  .tok-tag { color: var(--tok-tag); }

  button {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    color: var(--ink);
    font: 11px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", sans-serif);
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #doc-status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #doc-status[data-tone="error"] { color: var(--mp-danger-ink, #b4472c); }
  #doc-status[hidden] { display: none; }
</style>
</head>
<body>
  <header>
    <span class="kicker">代码编辑</span>
    <input id="doc-title" type="text" maxlength="120" spellcheck="false"
      autocomplete="off" aria-label="文档名称">
    <span class="metric" id="doc-caret">行 1，列 1</span>
    <span id="doc-dirty" hidden>未保存</span>
    <span class="select">
      <select id="doc-language" aria-label="语言"></select>
      <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </span>
    <div id="doc-format-root" class="format-actions">
      <button type="button" id="doc-format" class="menu-trigger"
        aria-haspopup="menu" aria-expanded="false" disabled>
        格式化
        <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
      </button>
      <div id="doc-format-menu" role="menu" aria-label="格式化与本地操作" tabindex="-1" hidden></div>
    </div>
    <span class="select">
      <select id="doc-highlight" aria-label="高亮" title="选择语法高亮"></select>
      <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg>
    </span>
    <button type="button" data-action="copy">复制文本</button>
    <button type="button" class="primary" data-action="save">保存为新条目</button>
  </header>
  <div class="editor">
    <pre id="editor-gutter" aria-hidden="true"></pre>
    <div class="editor-code">
      <pre id="editor-highlight" aria-hidden="true"></pre>
      <textarea id="editor-input" spellcheck="false" autocomplete="off"
        autocapitalize="off" wrap="off" aria-label="文档内容"></textarea>
    </div>
  </div>
  <!-- D-1069: the page draws its own action row; the footer is the status line. -->
  <footer>
    <span id="doc-status" role="status" aria-live="polite" hidden></span>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
