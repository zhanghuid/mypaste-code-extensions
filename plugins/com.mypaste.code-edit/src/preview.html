<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. Syntax colours come from the host's
     * code palette, which is designed for the code surface, so the editor
     * takes that surface and ink too.
     */
    --bg: var(--mp-surface-solid, #f3ece1);
    --solid: var(--mp-surface-solid, #f3ece1);
    --surface: var(--mp-surface-raised, #fbf7f0);
    --ink: var(--mp-ink, #2f261e);
    --muted: var(--mp-ink-soft, #8b7c6a);
    --line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --accent: var(--mp-accent, #a65d2e);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --focus: color-mix(in srgb, var(--mp-accent, #a65d2e) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 22%, transparent);
    --tok-keyword: var(--mp-code-keyword, #9a3f1d);
    --tok-string: var(--mp-code-string, #3f6b3a);
    --tok-number: var(--mp-code-number, #7a4fa3);
    --tok-comment: var(--mp-code-comment, #8b7c6a);
    --tok-type: var(--mp-code-type, #2d5f86);
    --tok-function: var(--mp-code-function, #245f70);
    /* The host has no separate literal token; a number is the closest voice. */
    --tok-literal: var(--mp-code-number, #8a5a00);
    --tok-property: var(--mp-code-property, #6b4423);
    --tok-tag: var(--mp-code-tag, #9a3f1d);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --solid: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 26%, transparent);
    --tok-keyword: var(--mp-code-keyword, #e7a07a);
    --tok-string: var(--mp-code-string, #a8c48a);
    --tok-number: var(--mp-code-number, #c8a6e0);
    --tok-comment: var(--mp-code-comment, #8f8272);
    --tok-type: var(--mp-code-type, #8fc0e0);
    --tok-function: var(--mp-code-function, #8fd0c8);
    --tok-literal: var(--mp-code-number, #d9b46a);
    --tok-property: var(--mp-code-property, #d9b48c);
    --tok-tag: var(--mp-code-tag, #e7a07a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .kicker {
    color: var(--muted);
    font-family: var(--mp-font-display, "New York", "Songti SC", Georgia, serif);
    font-size: 11px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  #doc-title {
    flex: 1 1 220px;
    min-width: 0;
    height: 30px;
    padding: 0 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font: 600 14px/1.4 var(--mp-font-display, "New York", "Songti SC", Georgia, serif);
  }
  #doc-title:hover { border-color: var(--line); }
  #doc-title:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus);
  }
  .metric {
    color: var(--muted);
    font: 11px/1 var(--mono);
    white-space: nowrap;
  }
  #doc-dirty {
    color: var(--accent);
    font-size: 11px;
    white-space: nowrap;
  }
  #doc-dirty[hidden] { display: none; }

  /*
   * One control size for the whole header row (D-1051): every action is a
   * square 30px surface (D-1045), a labelled control is the same height, and
   * each icon is one inline SVG (D-1055). Copy and save collapse to icons so
   * the row never reads as a wall of text; their titles stay in a tooltip.
   */
  #doc-language-badge,
  .icon-button {
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    color: var(--ink);
    font: 12px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  #doc-language-badge {
    display: inline-flex;
    align-items: center;
    padding: 0 8px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    white-space: nowrap;
  }
  .icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    padding: 0;
    cursor: pointer;
  }
  .icon-button .icon { width: 15px; height: 15px; }
  .icon-button[data-action="save"] {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
  }
  .icon-button:hover:not(:disabled) {
    border-color: color-mix(in srgb, var(--ink) 30%, var(--line));
  }
  .icon-button:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus);
  }
  .icon-button:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.55;
  }
  .panel-root { position: relative; display: inline-flex; }
  #doc-panel-toggle[aria-expanded="true"] { border-color: var(--accent); }

  /*
   * The 功能区 panel is an opaque raised sheet: --surface is translucent in
   * the host's warm palette, so it is laid over --solid instead of over the
   * editor. That is the whole difference between a panel and a ghost. It
   * folds the language grid and the format list behind one toggle so the
   * toolbar itself stays icons-only.
   */
  #doc-panel {
    position: fixed;
    z-index: 40;
    min-width: 260px;
    max-width: calc(100vw - 16px);
    overflow-y: auto;
    border: 1px solid var(--line);
    background:
      linear-gradient(var(--surface), var(--surface)),
      var(--solid);
    color: var(--ink);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--ink) 20%, transparent);
  }
  #doc-panel[hidden] { display: none; }
  #doc-panel:focus { outline: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 8px 7px 12px;
    border-bottom: 1px solid var(--line);
  }
  .panel-title {
    color: var(--muted);
    font: 600 10.5px/1.4 var(--mono);
    letter-spacing: 0.08em;
  }
  .panel-section { padding: 6px 8px 8px; }
  .panel-section + .panel-section { border-top: 1px solid var(--line); }
  .panel-section-title {
    padding: 6px 4px 4px;
    color: var(--muted);
    font: 600 10.5px/1.4 var(--mono);
    letter-spacing: 0.08em;
  }
  .language-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 4px;
  }
  .language-item {
    height: 30px;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    font: 11px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-align: left;
    cursor: pointer;
  }
  .language-item:hover:not(:disabled) { border-color: var(--accent); }
  .language-item:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--focus);
  }
  .language-item.is-active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    font-weight: 600;
  }
  .format-group + .format-group,
  .format-empty + .format-group {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--line);
  }
  .format-group-title {
    padding: 6px 4px 3px;
    color: var(--muted);
    font: 600 10.5px/1.4 var(--mono);
    letter-spacing: 0.08em;
  }
  .format-empty {
    padding: 6px 4px 5px;
    color: var(--muted);
    font: 12px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  .format-item {
    display: block;
    width: 100%;
    height: 32px;
    padding: 0 8px;
    overflow: hidden;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 12.5px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .format-item:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  .format-item:focus-visible {
    outline: none;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .format-item:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.5;
  }
  @media (max-width: 640px) {
    .metric, #doc-dirty { display: none; }
  }
  .editor {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
    background: var(--editor-bg);
  }
  .editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  #editor-gutter {
    margin: 0;
    padding: 14px 10px 14px 14px;
    overflow: hidden;
    border-right: 1px solid color-mix(in srgb, var(--editor-ink) 14%, transparent);
    color: var(--mp-code-comment, var(--muted));
    font: 12.5px/1.65 var(--mono);
    text-align: right;
    white-space: pre;
    user-select: none;
  }
  .editor-code {
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  #editor-highlight,
  #editor-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 14px 16px;
    border: 0;
    font: 12.5px/1.65 var(--mono);
    white-space: pre;
    tab-size: 2;
    overflow: auto;
  }
  #editor-highlight {
    overflow: hidden;
    color: var(--editor-ink);
    background: transparent;
    pointer-events: none;
  }
  #editor-input {
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    resize: none;
    outline: none;
  }
  #editor-input::selection { background: var(--selection); }
  #editor-input::placeholder { color: var(--muted); }

  .tok-keyword { color: var(--tok-keyword); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-type { color: var(--tok-type); }
  .tok-function { color: var(--tok-function); }
  .tok-literal { color: var(--tok-literal); }
  .tok-property { color: var(--tok-property); }
  .tok-tag { color: var(--tok-tag); }

  button {
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 0;
    background: var(--surface);
    color: var(--ink);
    font: 11px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", sans-serif);
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #doc-status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #doc-status[data-tone="error"] { color: var(--mp-danger-ink, #b4472c); }
  #doc-status[hidden] { display: none; }
</style>
</head>
<body>
  <header>
    <span class="kicker">代码编辑</span>
    <input id="doc-title" type="text" maxlength="120" spellcheck="false"
      autocomplete="off" aria-label="文档名称">
    <span id="doc-language-badge" role="status" aria-label="当前语言"></span>
    <span class="metric" id="doc-caret">行 1，列 1</span>
    <span id="doc-dirty" hidden>未保存</span>
    <div id="doc-panel-root" class="panel-root">
      <button type="button" id="doc-panel-toggle" class="icon-button"
        aria-haspopup="menu" aria-expanded="false" title="功能区" aria-label="功能区" disabled>
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M2 4.5h12"/>
            <circle cx="5.5" cy="4.5" r="1.6"/>
            <path d="M2 11.5h12"/>
            <circle cx="10.5" cy="11.5" r="1.6"/>
          </g>
        </svg>
      </button>
      <div id="doc-panel" role="dialog" aria-label="功能区" tabindex="-1" hidden>
        <div class="panel-head">
          <span class="panel-title">功能区</span>
          <button type="button" id="doc-panel-close" class="icon-button" aria-label="关闭功能区">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="panel-section">
          <div class="panel-section-title">语言</div>
          <div id="doc-language-grid" class="language-grid" role="group" aria-label="语言"></div>
        </div>
        <div class="panel-section">
          <div class="panel-section-title">格式化</div>
          <div id="doc-format-list" role="menu" aria-label="格式化与本地操作"></div>
        </div>
      </div>
    </div>
    <button type="button" data-action="copy" class="icon-button" title="复制文本" aria-label="复制文本">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <button type="button" class="icon-button" data-action="save" title="保存为新条目" aria-label="保存为新条目">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M3 2.5h8l2 2v9h-10z"/>
          <path d="M5 2.5v4h6v-4"/>
          <path d="M5 13.5v-4h6v4"/>
        </g>
      </svg>
    </button>
  </header>
  <div class="editor">
    <pre id="editor-gutter" aria-hidden="true"></pre>
    <div class="editor-code">
      <pre id="editor-highlight" aria-hidden="true"></pre>
      <textarea id="editor-input" spellcheck="false" autocomplete="off"
        autocapitalize="off" wrap="off" aria-label="文档内容"></textarea>
    </div>
  </div>
  <!-- D-1069: the page draws its own action row; the footer is the status line. -->
  <footer>
    <span id="doc-status" role="status" aria-live="polite" hidden></span>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
