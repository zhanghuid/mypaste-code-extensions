<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    /*
     * The host's resolved tokens arrive as --mp-* (D-1043); every value below
     * prefers them and keeps this document's own palette as the fallback for
     * an older host or a local preview. Syntax colours come from the host's
     * code palette, which is designed for the code surface, so the editor
     * takes that surface and ink too.
     */
    --bg: var(--mp-surface-solid, #f3ece1);
    --solid: var(--mp-surface-solid, #f3ece1);
    --surface: var(--mp-surface-raised, #fbf7f0);
    --ink: var(--mp-ink, #2f261e);
    --muted: var(--mp-ink-soft, #8b7c6a);
    --line: var(--mp-line, rgba(70, 48, 26, 0.14));
    --accent: var(--mp-accent, #a65d2e);
    --accent-ink: var(--mp-accent-ink, #fff8ef);
    --focus: color-mix(in srgb, var(--mp-accent, #a65d2e) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 22%, transparent);
    --tok-keyword: var(--mp-code-keyword, #9a3f1d);
    --tok-string: var(--mp-code-string, #3f6b3a);
    --tok-number: var(--mp-code-number, #7a4fa3);
    --tok-comment: var(--mp-code-comment, #8b7c6a);
    --tok-type: var(--mp-code-type, #2d5f86);
    --tok-function: var(--mp-code-function, #245f70);
    /* The host has no separate literal token; a number is the closest voice. */
    --tok-literal: var(--mp-code-number, #8a5a00);
    --tok-property: var(--mp-code-property, #6b4423);
    --tok-tag: var(--mp-code-tag, #9a3f1d);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  /*
   * The scheme comes from the host's theme message (D-1042): the frame's own
   * prefers-color-scheme follows the system, not the appearance chosen in
   * MyPaste. Until the message arrives the document uses its light palette.
   */
  :root[data-scheme="dark"] {
    color-scheme: dark;
    --bg: var(--mp-surface-solid, #171412);
    --solid: var(--mp-surface-solid, #171412);
    --surface: var(--mp-surface-raised, #201c18);
    --ink: var(--mp-ink, #f0e6d9);
    --muted: var(--mp-ink-soft, #9a8c7b);
    --line: var(--mp-line, rgba(255, 236, 214, 0.12));
    --accent: var(--mp-accent, #e2955f);
    --accent-ink: var(--mp-accent-ink, #241a12);
    --focus: color-mix(in srgb, var(--mp-accent, #e2955f) 35%, transparent);
    --editor-bg: var(--mp-code-surface, var(--surface));
    --editor-ink: var(--mp-code-ink, var(--ink));
    --selection: color-mix(in srgb, var(--editor-ink) 26%, transparent);
    --tok-keyword: var(--mp-code-keyword, #e7a07a);
    --tok-string: var(--mp-code-string, #a8c48a);
    --tok-number: var(--mp-code-number, #c8a6e0);
    --tok-comment: var(--mp-code-comment, #8f8272);
    --tok-type: var(--mp-code-type, #8fc0e0);
    --tok-function: var(--mp-code-function, #8fd0c8);
    --tok-literal: var(--mp-code-number, #d9b46a);
    --tok-property: var(--mp-code-property, #d9b48c);
    --tok-tag: var(--mp-code-tag, #e7a07a);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }

  /*
   * The document header. The page owns the whole card now (D-1097), so this is
   * one 44px band instead of a strip holding an empty tab: the editable title
   * sits at the left with an accent rule beneath it, and the document's actions
   * sit at the right, every one of them a 28px control so the row has a single
   * size (D-1051). Closing is set apart by a hairline and is the only control
   * the page does not tint.
   */
  .doc-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    height: 44px;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .doc-id {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    height: 100%;
    padding-right: 8px;
  }
  .doc-id::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--accent);
  }
  .doc-icon { width: 15px; height: 15px; flex: none; color: var(--muted); }
  /* The title is sized to its text by fitTitle(), so it reads as a filename. */
  #doc-title {
    min-width: 48px;
    max-width: calc(100vw - 340px);
    height: 26px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 600 13px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  #doc-title:focus { outline: none; }
  #doc-title::selection { background: var(--selection); }
  #doc-dirty {
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  #doc-dirty[hidden] { display: none; }
  .doc-actions { display: flex; align-items: center; gap: 4px; }
  .doc-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-action .icon { width: 15px; height: 15px; }
  .doc-action:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    color: var(--ink);
  }
  .doc-action:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .doc-action:disabled { opacity: 0.4; cursor: default; }
  .doc-action[data-action="save"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .doc-action[data-action="save"]:hover:not(:disabled) {
    background: var(--accent);
    color: var(--accent-ink);
    filter: brightness(1.08);
  }
  .doc-sep { width: 1px; height: 16px; flex: none; margin: 0 4px; background: var(--line); }
  .doc-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--muted);
  }
  .doc-close .icon { width: 14px; height: 14px; }
  .doc-close:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }
  .doc-close:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }

  /*
   * The header's dropdowns: ghost text triggers rather than boxed chips, so
   * the band holds one kind of control and the title stays the only filled
   * element at the left. Their menus are fixed sheets, so the header never
   * clips them.
   */
  .doc-actions .menu-root { position: relative; display: inline-flex; }
  .menu-trigger {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 12px/1 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  .menu-trigger:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    color: var(--ink);
  }
  .menu-trigger:focus-visible {
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .menu-trigger[aria-expanded="true"] { color: var(--accent); }
  .menu-trigger:disabled { opacity: 0.45; cursor: default; }
  .menu-trigger .trigger-chevron { width: 12px; height: 12px; flex: none; }
  #doc-language-badge { font-family: var(--mono); font-size: 11.5px; }

  /*
   * A dropdown is an opaque raised sheet (a transient popup, not a ghost over
   * the editor): it sits on --solid, drops a soft shadow, and its rows are
   * transparent with a hover tint and a leading accent bar for the selected
   * or focused row. The 本地 group is set off by a hairline, not by a title.
   */
  .menu {
    position: fixed;
    z-index: 40;
    min-width: 200px;
    max-width: calc(100vw - 16px);
    max-height: min(360px, calc(100vh - 16px));
    overflow-y: auto;
    padding: 4px;
    border: 1px solid var(--line);
    background:
      linear-gradient(var(--surface), var(--surface)),
      var(--solid);
    color: var(--ink);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--ink) 20%, transparent);
  }
  .menu[hidden] { display: none; }
  .menu:focus { outline: none; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 30px;
    padding: 0 8px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: 12.5px/1.4 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
    text-align: left;
  }
  .menu-item:hover:not(:disabled) {
    background: color-mix(in srgb, var(--ink) 6%, transparent);
  }
  .menu-item:focus-visible {
    outline: none;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .menu-item:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  .menu-item .item-check {
    width: 14px;
    height: 14px;
    flex: none;
    color: var(--accent);
    visibility: hidden;
  }
  .menu-item.is-active .item-check { visibility: visible; }
  .menu-item .item-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-item .item-source {
    flex: none;
    color: var(--muted);
    font: 10.5px/1 var(--mono);
  }
  .menu-empty {
    padding: 8px 9px;
    color: var(--muted);
    font: 12px/1.5 var(--mp-font-body, -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif);
  }
  .menu-separator {
    height: 1px;
    margin: 4px 8px;
    background: var(--line);
  }

  .editor {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
    background: var(--editor-bg);
  }
  .editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  #editor-gutter {
    margin: 0;
    padding: 14px 10px 14px 14px;
    overflow: hidden;
    border-right: 1px solid color-mix(in srgb, var(--editor-ink) 14%, transparent);
    color: var(--mp-code-comment, var(--muted));
    font: 12.5px/1.65 var(--mono);
    text-align: right;
    white-space: pre;
    user-select: none;
  }
  .editor-code {
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  #editor-highlight,
  #editor-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 14px 16px;
    border: 0;
    font: 12.5px/1.65 var(--mono);
    white-space: pre;
    tab-size: 2;
    overflow: auto;
  }
  #editor-highlight {
    overflow: hidden;
    color: var(--editor-ink);
    background: transparent;
    pointer-events: none;
  }
  #editor-input {
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    resize: none;
    outline: none;
  }
  #editor-input::selection { background: var(--selection); }
  #editor-input::placeholder { color: var(--muted); }

  .tok-keyword { color: var(--tok-keyword); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-type { color: var(--tok-type); }
  .tok-function { color: var(--tok-function); }
  .tok-literal { color: var(--tok-literal); }
  .tok-property { color: var(--tok-property); }
  .tok-tag { color: var(--tok-tag); }

  /*
   * The status bar mirrors GitHub's editor footer: the action result on the
   * left, the buffer's language, caret and indent on the right.
   */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 26px;
    padding: 4px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font: 11px/1.4 var(--mono);
  }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
  }
  #doc-status {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #doc-status[data-tone="error"] { color: var(--mp-danger-ink, #b4472c); }
  #doc-status[hidden] { display: none; }
  @media (max-width: 640px) {
    .statusbar-right .status-static { display: none; }
  }

  /*
   * Corner system (host D-1099): one ladder, so every box answers with the
   * same family. A mark is 4px, a control 6px, a card or popover 10px, a
   * floating dialog 14px, and an indicator or scrollbar is a capsule.
   */
  :root {
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-pill: 999px;
  }
  button {
    border-radius: var(--radius-sm);
  }
  .menu {
    border-radius: var(--radius-md);
  }
  .menu-item,
  .menu-empty {
    border-radius: var(--radius-sm);
  }
  .doc-id::after,
  .menu-separator {
    border-radius: var(--radius-pill);
  }
</style>
</head>
<body>
  <header class="doc-head">
    <div class="doc-id">
      <svg class="doc-icon" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 2.5h6l3 3v8h-9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 2.5v3h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <input id="doc-title" type="text" maxlength="120" spellcheck="false"
        autocomplete="off" aria-label="文档名称">
      <span id="doc-dirty" aria-label="未保存" hidden></span>
    </div>
    <div class="doc-actions">
      <div class="menu-root" id="doc-language-root">
        <button type="button" class="menu-trigger" id="doc-language-toggle"
          aria-haspopup="menu" aria-expanded="false" aria-label="选择语言" title="语言">
          <span id="doc-language-badge">自动识别</span>
          <svg class="trigger-chevron" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="menu" id="doc-language-menu" role="menu" aria-label="语言" tabindex="-1" hidden></div>
      </div>
      <div class="menu-root" id="doc-format-root">
        <button type="button" class="menu-trigger" id="doc-format-toggle"
          aria-haspopup="menu" aria-expanded="false" aria-label="格式化与本地操作" title="格式化">
          <span>格式化</span>
          <svg class="trigger-chevron" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="menu" id="doc-format-menu" role="menu" aria-label="格式化与本地操作" tabindex="-1" hidden></div>
      </div>
      <span class="doc-sep" aria-hidden="true"></span>
      <button type="button" data-action="copy" class="doc-action" title="复制文本" aria-label="复制文本">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <rect x="5.5" y="5.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" class="doc-action" data-action="save" title="保存为新条目" aria-label="保存为新条目">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M3 2.5h8l2 2v9h-10z"/>
            <path d="M5 2.5v4h6v-4"/>
            <path d="M5 13.5v-4h6v4"/>
          </g>
        </svg>
      </button>
      <span class="doc-sep" aria-hidden="true"></span>
      <button type="button" class="doc-close" id="doc-close" title="关闭" aria-label="关闭">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.5 4.5l7 7M11.5 4.5l-7 7" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="editor">
    <pre id="editor-gutter" aria-hidden="true"></pre>
    <div class="editor-code">
      <pre id="editor-highlight" aria-hidden="true"></pre>
      <textarea id="editor-input" spellcheck="false" autocomplete="off"
        autocapitalize="off" wrap="off" aria-label="文档内容"></textarea>
    </div>
  </div>
  <footer class="statusbar">
    <span id="doc-status" role="status" aria-live="polite" hidden></span>
    <div class="statusbar-right">
      <span id="doc-caret">行 1，列 1</span>
      <span class="status-static">空格: 2</span>
      <span class="status-static">UTF-8</span>
    </div>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
