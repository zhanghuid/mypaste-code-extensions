<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    color-scheme: light;
    --bg: #f3ece1;
    --surface: #fbf7f0;
    --ink: #2f261e;
    --muted: #8b7c6a;
    --line: rgba(70, 48, 26, 0.14);
    --accent: #a65d2e;
    --accent-ink: #fff8ef;
    --focus: rgba(166, 93, 46, 0.35);
    --selection: rgba(166, 93, 46, 0.22);
    --tok-keyword: #9a3f1d;
    --tok-string: #3f6b3a;
    --tok-number: #7a4fa3;
    --tok-comment: #8b7c6a;
    --tok-type: #2d5f86;
    --tok-function: #245f70;
    --tok-literal: #8a5a00;
    --tok-property: #6b4423;
    --tok-tag: #9a3f1d;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #171412;
      --surface: #201c18;
      --ink: #f0e6d9;
      --muted: #9a8c7b;
      --line: rgba(255, 236, 214, 0.12);
      --accent: #e2955f;
      --accent-ink: #241a12;
      --focus: rgba(226, 149, 95, 0.35);
      --selection: rgba(226, 149, 95, 0.26);
      --tok-keyword: #e7a07a;
      --tok-string: #a8c48a;
      --tok-number: #c8a6e0;
      --tok-comment: #8f8272;
      --tok-type: #8fc0e0;
      --tok-function: #8fd0c8;
      --tok-literal: #d9b46a;
      --tok-property: #d9b48c;
      --tok-tag: #e7a07a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .kicker {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  #doc-title {
    flex: 1;
    min-width: 0;
    padding: 4px 6px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: 600 14px/1.4 -apple-system, "PingFang SC", sans-serif;
  }
  #doc-title:hover { border-color: var(--line); }
  #doc-title:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
  }
  .metric {
    color: var(--muted);
    font: 11px/1 var(--mono);
    white-space: nowrap;
  }
  #doc-dirty {
    color: var(--accent);
    font-size: 11px;
    white-space: nowrap;
  }
  #doc-dirty[hidden] { display: none; }
  #doc-language {
    padding: 4px 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    font: 11px/1.4 var(--mono);
  }
  #doc-close {
    width: 28px;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  #doc-close:hover { color: var(--ink); border-color: var(--accent); }

  .editor {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    min-height: 0;
    overflow: hidden;
    background: var(--surface);
  }
  .editor:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
  #editor-gutter {
    margin: 0;
    padding: 14px 10px 14px 14px;
    overflow: hidden;
    border-right: 1px solid var(--line);
    color: var(--muted);
    font: 12.5px/1.65 var(--mono);
    text-align: right;
    white-space: pre;
    user-select: none;
  }
  .editor-code {
    position: relative;
    min-width: 0;
    min-height: 0;
  }
  #editor-highlight,
  #editor-input {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 14px 16px;
    border: 0;
    font: 12.5px/1.65 var(--mono);
    white-space: pre;
    tab-size: 2;
    overflow: auto;
  }
  #editor-highlight {
    overflow: hidden;
    color: var(--ink);
    background: transparent;
    pointer-events: none;
  }
  #editor-input {
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    resize: none;
    outline: none;
  }
  #editor-input::selection { background: var(--selection); }
  #editor-input::placeholder { color: var(--muted); }

  .tok-keyword { color: var(--tok-keyword); }
  .tok-string { color: var(--tok-string); }
  .tok-number { color: var(--tok-number); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-type { color: var(--tok-type); }
  .tok-function { color: var(--tok-function); }
  .tok-literal { color: var(--tok-literal); }
  .tok-property { color: var(--tok-property); }
  .tok-tag { color: var(--tok-tag); }

  footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #doc-status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #doc-status[data-tone="error"] { color: #b4472c; }
  #doc-status[hidden] { display: none; }
  footer button {
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  footer button:hover:not(:disabled) { border-color: var(--accent); }
  footer button:disabled { opacity: 0.45; cursor: default; }
  footer button[data-action="save"] {
    border-color: transparent;
    background: var(--accent);
    color: var(--accent-ink);
  }
</style>
</head>
<body>
  <header>
    <span class="kicker">代码编辑</span>
    <input id="doc-title" type="text" maxlength="120" spellcheck="false"
      autocomplete="off" aria-label="文档名称">
    <span class="metric" id="doc-caret">行 1，列 1</span>
    <span id="doc-dirty" hidden>未保存</span>
    <select id="doc-language" aria-label="语言"></select>
    <button id="doc-close" type="button" aria-label="关闭代码编辑">×</button>
  </header>
  <div class="editor">
    <pre id="editor-gutter" aria-hidden="true"></pre>
    <div class="editor-code">
      <pre id="editor-highlight" aria-hidden="true"></pre>
      <textarea id="editor-input" spellcheck="false" autocomplete="off"
        autocapitalize="off" wrap="off" aria-label="文档内容"></textarea>
    </div>
  </div>
  <footer>
    <span id="doc-status" role="status" aria-live="polite" hidden></span>
    <button type="button" data-action="copy">复制文本</button>
    <button type="button" data-action="save">保存为新条目</button>
  </footer>
<script>
<!--bundle-->
</script>
</body>
</html>
